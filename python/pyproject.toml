[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "crawlora-wattpad"
version = "0.1.0"
description = "Crawlora Wattpad API client with 11 endpoints for story, author, search, category, language, and public comment data"
readme = "README.md"
keywords = ["crawlora", "api-client", "sdk", "web-scraping", "scraping-api", "wattpad", "wattpad-api", "wattpad-scraper", "wattpad-data", "wattpad-story", "wattpad-author", "wattpad-search", "wattpad-category", "wattpad-language", "wattpad-public-comment-data"]
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Crawlora" }]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Typing :: Typed",
]
dependencies = ["typing-extensions>=4.7; python_version < '3.11'"]

[project.optional-dependencies]
async = ["httpx>=0.27"]
test = ["mypy>=1.11", "pytest>=8"]

[project.urls]
Homepage = "https://crawlora.net/?utm_source=pypi&utm_medium=referral&utm_campaign=platform-clients&utm_content=wattpad-python-homepage"
Documentation = "https://crawlora.net/docs?utm_source=pypi&utm_medium=referral&utm_campaign=platform-clients&utm_content=wattpad-python-api-docs"
Repository = "https://github.com/Crawlora-org/crawlora-wattpad"

[tool.setuptools.packages.find]
where = ["."]
include = ["crawlora_wattpad"]

[tool.setuptools.package-data]
"crawlora_wattpad" = ["py.typed", "*.pyi"]
